name: Build nxymusic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build nxymusic release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Build FOSS release APK
        run: |
          printf '\nisFullBuild=false\n' >> gradle.properties
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Sign and verify nxymusic APK
        run: |
          set -euo pipefail
          apk=$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)
          if [[ -z "$apk" ]]; then
            apk=$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'nxymusic.apk' | head -n 1)
          fi
          test -n "$apk"
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          aligned="$RUNNER_TEMP/nxymusic-aligned.apk"
          "$build_tools/zipalign" -p -f 4 "$apk" "$aligned"
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/nxymusic-debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname 'CN=Android Debug,O=Android,C=US' \
            -keyalg RSA -keysize 2048 -validity 10000
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/nxymusic-debug.keystore" \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out androidApp/build/outputs/apk/release/nxymusic.apk \
            "$aligned"
          "$build_tools/apksigner" verify --verbose androidApp/build/outputs/apk/release/nxymusic.apk

      - name: Upload nxymusic APK
        uses: actions/upload-artifact@v4
        with:
          name: nxymusic
          path: androidApp/build/outputs/apk/release/nxymusic.apk
          if-no-files-found: error
