name: Build NXYMusic APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed APK as a public GitHub Release
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build NXYMusic release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout source and dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply NXYMusic release-feed override to core submodule
        run: git -C core apply ../.github/patches/nxymusic-update-feed.patch

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: microsoft
          cache: gradle

      - name: Build FOSS release APK
        run: |
          printf '\nisFullBuild=false\n' >> gradle.properties
          ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Align, sign and verify NXYMusic APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD repository Actions secrets before building a signed APK."
            exit 1
          fi

          apk=$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*universal*.apk' | head -n 1)
          if [[ -z "$apk" ]]; then
            apk=$(find androidApp/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' ! -name 'nxymusic.apk' | head -n 1)
          fi
          test -n "$apk"

          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          aligned="$RUNNER_TEMP/nxymusic-aligned.apk"
          keystore="$RUNNER_TEMP/nxymusic-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$build_tools/zipalign" -p -f 4 "$apk" "$aligned"
          "$build_tools/apksigner" sign \
            --ks "$keystore" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias nxymusic \
            --out androidApp/build/outputs/apk/release/nxymusic.apk \
            "$aligned"
          "$build_tools/apksigner" verify --verbose androidApp/build/outputs/apk/release/nxymusic.apk
          rm -f "$keystore" "$aligned"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nxymusic
          path: androidApp/build/outputs/apk/release/nxymusic.apk
          if-no-files-found: error

      - name: Publish public GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/^version-name = "\([^"]*\)"/\1/p' gradle/libs.versions.toml | head -n 1)
          test -n "$version_name"
          tag="v${version_name}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $tag."
            exit 1
          fi
          gh release create "$tag" \
            androidApp/build/outputs/apk/release/nxymusic.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NXYMusic ${tag}" \
            --generate-notes \
            --latest
